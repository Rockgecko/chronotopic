[project]
name = "backend"
version = "0.1.0"
description = "Backend for Chronotopic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.4",
    "python-frontmatter>=1.1.0",
    "sqlalchemy>=2.0.36",
    "typer>=0.13.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
    "pytest-clarity>=1.0.1",
]
