<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal History Visualization</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body>
    <h1>Horizontal History Visualization</h1>
    <div class="filter-container">
        <div class="filter-section">
            <label>Stories:</label>
            <select id="story-select" multiple="multiple" style="width: 100%">
                <option value="">All Stories</option>
            </select>
        </div>
        <div class="filter-section">
            <label>Locations:</label>
            <select id="location-select" multiple="multiple" style="width: 100%">
                <option value="">All Locations</option>
            </select>
        </div>
        <div class="filter-section date-filters">
            <div class="date-input">
                <label>Start Date:</label>
                <div class="date-control">
                    <input type="number" id="start-year" placeholder="Year">
                    <select id="start-era">
                        <option value="BCE">BCE</option>
                        <option value="CE">CE</option>
                    </select>
                </div>
            </div>
            <div class="date-input">
                <label>End Date:</label>
                <div class="date-control">
                    <input type="number" id="end-year" placeholder="Year">
                    <select id="end-era">
                        <option value="BCE">BCE</option>
                        <option value="CE" selected>CE</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="filter-section">
            <button id="reset-filters" class="reset-button">Reset All Filters</button>
        </div>
    </div>
    <div id="debug"></div>
    <div id="timeline"></div>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
